<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listing Details — Real Estate CRM</title>
  <meta name="description" content="Bitrix24 Real Estate Listing Details with 4 dynamic tailored layouts and rich media file previews">
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Bitrix24 Official JavaScript SDK -->
  <script src="//api.bitrix24.com/api/v1/"></script>
  <!-- Stylesheet -->
  <link rel="stylesheet" href="/css/listing-details.css">
</head>
<body>
  <div class="listing-tab-container">

    <!-- ── 1. Loading Spinner ─────────────────────────────────────── -->
    <div id="loading" class="spinner-wrap">
      <div class="spinner-ring"></div>
      <div class="spinner-text">
        <span class="spinner-title">Loading Listing Details</span>
        <span class="spinner-sub">Fetching fields and media from Bitrix24...</span>
      </div>
    </div>

    <!-- ── 2. Active Tab Content ──────────────────────────────────── -->
    <div id="content" style="display: none;">

      <!-- Top Command Bar -->
      <header class="b24-toolbar-bar">
        <div class="toolbar-left-group">
          <span id="layout-mode-badge" class="layout-pill layout-pill-rent">Detecting Layout…</span>
          <span id="fields-count-badge" class="b24-count-pill">— fields</span>
        </div>

        <div class="b24-search-wrap">
          <span class="b24-search-icon">🔍</span>
          <input
            type="text"
            id="field-search-input"
            class="b24-search-input"
            placeholder="Search fields — Price, RERA, Bedrooms, Floor, Deposit…"
            autocomplete="off"
            spellcheck="false"
          >
          <button type="button" id="btn-clear-search" class="b24-search-clear" style="display:none" aria-label="Clear search">&times;</button>
        </div>

        <div class="toolbar-right-actions">
          <button type="button" id="btn-toggle-all" class="btn btn-secondary btn-compact" title="Expand or collapse all sections">
            Collapse All
          </button>
          <button type="button" id="btn-refresh" class="btn btn-secondary btn-compact" title="Reload listing from Bitrix24">
            🔄 Refresh
          </button>
        </div>
      </header>

      <!-- Jump-to Section Anchor Pills -->
      <nav id="section-nav-pills" class="b24-section-nav" aria-label="Jump to section">
        <!-- Rendered dynamically by listing-details.js -->
      </nav>

      <!-- Main Listing Form -->
      <form id="listing-details-form" novalidate onsubmit="return false;">
        <div id="sections-container">
          <!-- Rendered dynamically based on active layout -->
        </div>

        <!-- Sticky Bottom Action Bar -->
        <div class="form-actions-bar">
          <div class="action-bar-left">
            <div id="dirty-indicator" class="dirty-badge" style="display: none;">
              <span class="dirty-dot">●</span>
              <span id="dirty-text">Unsaved changes</span>
            </div>
          </div>
          <div class="action-bar-right">
            <button type="button" id="btn-cancel" class="btn btn-secondary" style="display: none;">
              Cancel
            </button>
            <button type="submit" id="btn-save" class="btn btn-save-b24">
              ✓ &nbsp;SAVE CHANGES
            </button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- ── 3. Lightbox & Document Preview Modal (Direct child of body to guarantee viewport bounds) ── -->
  <div id="lightbox-modal" class="lightbox-modal" style="display: none;" role="dialog" aria-modal="true" aria-label="File Preview">
    <div class="lightbox-content">

      <!-- Header -->
      <div class="lightbox-header">
        <div class="lightbox-header-left">
          <span id="lightbox-file-icon" class="lightbox-file-icon">🖼️</span>
          <span id="lightbox-title" class="lightbox-title">File Preview</span>
          <span id="lightbox-counter" class="lightbox-counter" style="display:none"></span>
        </div>
        <div class="lightbox-actions">
          <button type="button" id="lightbox-zoom-toggle-btn" class="lb-action-btn" style="display:none" title="Toggle zoom (or scroll)">
            🔍 Zoom
          </button>
          <a id="lightbox-download-link" href="#" target="_blank" download class="lb-action-btn" title="Download file">
            ⬇ Download
          </a>
          <button type="button" id="lightbox-close-btn" class="lb-action-btn lb-close-btn" aria-label="Close preview">
            ✕ Close
          </button>
        </div>
      </div>

      <!-- Body with nav arrows -->
      <div id="lightbox-body" class="lightbox-body">
        <!-- Gallery arrows -->
        <button type="button" id="lb-nav-prev" class="lb-nav-btn lb-nav-prev" aria-label="Previous" style="display:none">‹</button>
        <button type="button" id="lb-nav-next" class="lb-nav-btn lb-nav-next" aria-label="Next" style="display:none">›</button>

        <!-- Zoom corner controls (images only) -->
        <div id="lb-zoom-controls" class="lb-zoom-controls" style="display:none">
          <button type="button" class="lb-zoom-ctrl-btn" id="lb-zoom-in-btn" title="Zoom In">＋</button>
          <button type="button" class="lb-zoom-ctrl-btn" id="lb-zoom-out-btn" title="Zoom Out">−</button>
          <button type="button" class="lb-zoom-ctrl-btn" id="lb-zoom-reset-btn" title="Reset">⊡</button>
        </div>

        <!-- Keyboard hints (fade in on hover) -->
        <div class="lb-hints">
          <span class="lb-hint-pill"><span class="lb-hint-key">←</span><span class="lb-hint-key">→</span> Navigate</span>
          <span class="lb-hint-pill"><span class="lb-hint-key">Esc</span> Close</span>
          <span class="lb-hint-pill"><span class="lb-hint-key">scroll</span> Zoom</span>
        </div>

        <!-- Populated dynamically with <img> or <iframe> -->
      </div>

      <!-- Thumbnail filmstrip (hidden for single-file) -->
      <div id="lb-filmstrip" class="lb-filmstrip" style="display:none">
        <!-- Populated dynamically -->
      </div>

    </div>
  </div>

  <!-- ── 4. Toast Alerts Container ──────────────────────────────── -->
  <div id="toast-container" aria-live="polite"></div>

  <script src="/js/listing-details.js"></script>
</body>
</html>
